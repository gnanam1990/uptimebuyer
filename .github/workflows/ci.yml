name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: uptimebuyer
          POSTGRES_PASSWORD: uptimebuyer
          POSTGRES_DB: uptimebuyer_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uptimebuyer" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://uptimebuyer:uptimebuyer@localhost:5432/uptimebuyer_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Clean-checkout bootstrap (T-001)
        run: pnpm bootstrap
