services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: uptimebuyer
      POSTGRES_PASSWORD: uptimebuyer
      POSTGRES_DB: uptimebuyer_dev
    ports: ['55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uptimebuyer']
      interval: 2s
      retries: 30
